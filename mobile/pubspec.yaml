name: flutter_application_1
description: "Women Safety App — Android + IoT Based System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase — phone OTP auth + Firestore for contacts (no email/password)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Maps + location (Week 2) and route safety scoring (Week 3)
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Networking for Google Directions API calls
  http: ^1.6.0

  # Parses the crime-data-pipeline's zone safety score CSV (Week 1 output)
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # Bundles the Week 1 crime-data-pipeline output into the app so
  # SafetyScoreService can read it offline without a network call.
  # See lib/services/safety_score_service.dart
  assets:
    - assets/data/nerul_zone_safety_scores.csv
